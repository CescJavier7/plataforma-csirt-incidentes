<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plataforma de Gestión de Incidentes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Centro de Respuesta a Incidentes (CSIRT)</h1>
      <p id="estado" aria-live="polite">Cargando plataforma...</p>
    </header>

    <section class="card" id="form-seccion">
      <h2>Cerrar o Gestionar Incidente</h2>
      <form id="form-estado">
        <div>
          <label for="editor-usuario">Usuario asignado (Analista, Supervisor o Admin):</label>
          <input type="text" id="editor-usuario" autocomplete="username" required>
        </div>
        <div>
          <label for="editor-password">Contraseña:</label>
          <input type="password" id="editor-password" autocomplete="current-password" required>
        </div>
        <button type="button" id="btn-consultar">Consultar incidentes</button>
        <div>
          <label for="incidente-id">ID del Incidente:</label>
          <input type="number" id="incidente-id" value="1" required>
        </div>
        <div>
          <label for="nuevo-estado">Nuevo Estado:</label>
          <select id="nuevo-estado">
            <option value="EN_PROCESO">EN_PROCESO</option>
            <option value="CERRADO">CERRADO</option>
            <option value="ABIERTO">ABIERTO</option>
          </select>
        </div>
        <div>
          <label for="resolucion">Resolución técnica (Obligatoria para Cierre):</label>
          <textarea id="resolucion" placeholder="Detalle las acciones de contención realizadas..."></textarea>
        </div>
        <button type="submit" id="btn-actualizar">Actualizar estado (Supervisor/Admin)</button>
      </form>
    </section>

    <!-- Sección de Rendimiento y Evidencia Visual (WebP con dimensiones explícitas y Lazy Loading) -->
    <section class="card">
      <h2>Topología y Monitoreo de Red</h2>
      <figure>
        <img 
          src="assets/diagrama-red.png.webp" 
          alt="Topología de red del CSIRT" 
          width="610" 
          height="323" 
          loading="lazy"
          style="max-width: 100%; height: auto; border-radius: 4px;"
        >
        <figcaption><small>Diagrama de arquitectura protegido contra incidentes (formato optimizado WebP).</small></figcaption>
      </figure>
    </section>

    <section id="lista-incidentes" class="grid"></section>
  </main>

  <!-- Script colocado al final del contenido para ejecución segura -->
  <script src="js/app.js"></script>
</body>
</html>
