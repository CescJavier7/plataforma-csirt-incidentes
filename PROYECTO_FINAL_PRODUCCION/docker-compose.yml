services:
  # ----------------------------------------------------------------------------
  # Base de Datos Relacional de Producción: MySQL 8.4 LTS
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: csirt_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-csirt_incidentes}
      MYSQL_USER: ${MYSQL_USER:-csirt_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
    volumes:
      - mysql_data:/var/lib/mysql
    # En producción la base de datos NO se expone al host (Regla 5 de Seguridad)
    # La comunicación se realiza exclusivamente a través de la red interna csirt_network
    networks:
      - csirt_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # API y Aplicación Web: Node.js 22 LTS Alpine
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csirt_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PERSISTENCE: prisma
      DATABASE_URL: mysql://${MYSQL_USER:-csirt_user}:${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-csirt_incidentes}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SUPERVISOR_PASSWORD: ${SUPERVISOR_PASSWORD:?Set SUPERVISOR_PASSWORD in .env}
      ANALISTA_PASSWORD: ${ANALISTA_PASSWORD:?Set ANALISTA_PASSWORD in .env}
    command: >
      sh -c "npx prisma migrate deploy &&
             node prisma/seed.js &&
             node src/server.js"
    expose:
      - "3000"
    networks:
      - csirt_network

  # ----------------------------------------------------------------------------
  # Proxy Inverso Perimetral y Caché: Nginx Alpine
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:1.27-alpine
    container_name: csirt_nginx_proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - csirt_network

networks:
  csirt_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
