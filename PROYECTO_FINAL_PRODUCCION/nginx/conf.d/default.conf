# Definición de límites de conexión y peticiones por IP (Mitigación DoS)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream csirt_backend {
    server app:3000;
    keepalive 32;
}

# ==============================================================================
# 1. Servidor HTTP (Puerto 80): Redirección o Operación con Proxy Headers
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Desactivar versión de Nginx en cabeceras de respuesta
    server_tokens off;

    # Compresión gzip para optimizar ancho de banda (Unidad 7)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Tamaño máximo de carga (cuerpo de solicitud)
    client_max_body_size 10M;

    # Cabeceras de seguridad perimetral (OWASP A02)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    # Servir archivos estáticos del cliente con caché de larga duración
    location /assets/ {
        proxy_pass http://csirt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location ~* \.(?:css|js|webp|png|jpg|jpeg|svg|ico)$ {
        proxy_pass http://csirt_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1d;
        add_header Cache-Control "public, max-age=86400, immutable";
    }

    # Proxy inverso para la API REST protegida
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://csirt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Enrutamiento general para Single Page Application (SPA)
    location / {
        proxy_pass http://csirt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloqueo de acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

